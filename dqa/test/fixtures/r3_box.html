<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>r3_box</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;color:#1B1F24;background:#fff}
#root{height:100vh;display:flex;flex-direction:column;position:relative}
.map{height:300px;position:relative;background:#EEF3EC}
.pin{position:absolute;left:230px;top:150px}.pin span{font-size:12px;background:#fff;padding:2px 6px;border-radius:6px;white-space:nowrap;color:#1B1F24}
.fbtn{position:absolute;right:12px;top:110px;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid #ccc;font-size:20px}
.iconwrap{position:absolute;left:16px;top:16px;width:44px;height:44px}.iconwrap button{width:44px;height:44px;border:1px solid #ccc;background:#fff;border-radius:12px}
.badge{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:#C62828;color:#fff;font-size:11px;text-align:center;line-height:18px}
.list{flex:1;overflow-y:auto;padding:12px 16px}
.tags{font-size:14px;line-height:22px;word-break:break-all}.tags a{color:#1C5FB8;margin-right:6px;text-decoration:none}
.row{height:64px;border-bottom:1px solid #E2E5E9;display:flex;align-items:center;justify-content:space-between}
.row button{height:32px;padding:0 12px;border-radius:16px;border:1px solid #ccc;background:#fff}
.fab{position:absolute;right:16px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#03A84E;color:#fff;font-size:26px;border:0}
</style></head><body><div id="root">
<div class="map"><div class="pin"><span>숲속로스터리 망원점</span></div><button class="fbtn" aria-label="내 위치">◎</button>
<div class="iconwrap"><button aria-label="알림">◇</button><span class="badge">3</span></div></div>
<div class="list"><p class="tags"><a href="#">#주말나들이추천코스서울근교당일치기여행지노을맛집총정리</a><a href="#">#노을</a></p>
<div class="row"><span>하늘다람쥐</span><button>팔로우</button></div><div class="row"><span>바다거북</span><button>팔로우</button></div>
<div class="row"><span>숲속여우</span><button>팔로우</button></div><div class="row"><span>들판토끼</span><button>팔로우</button></div>
<div class="row"><span>강가수달</span><button>팔로우</button></div><div class="row"><span>산골다람쥐</span><button>팔로우</button></div><div class="row"><span>이웃1</span><button>팔로우</button></div><div class="row"><span>이웃2</span><button>팔로우</button></div><div class="row"><span>이웃3</span><button>팔로우</button></div><div class="row"><span>이웃4</span><button>팔로우</button></div><div class="row"><span>이웃5</span><button>팔로우</button></div><div class="row"><span>이웃6</span><button>팔로우</button></div></div>
<button class="fab" aria-label="글쓰기">+</button></div></body></html>
