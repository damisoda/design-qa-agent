<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>G1 글자 기호 아이콘</title>
<style>body{margin:0;font:14px/20px "Helvetica Neue",Arial,sans-serif} #root{padding:16px} button{font:inherit;min-width:44px;min-height:44px;border:0;background:#eee;margin:4px} .row{padding:8px 0} .ic{font-family:"MyIconFont__missing";font-style:normal;font-size:20px}</style></head>
<body><div id="root">
<!-- 음악 재생기: 재생 버튼을 기호 글자로 -->
<div class="row"><button aria-label="재생">▶</button><span>지금 재생 중인 곡</span></div>
<!-- 서랍 메뉴 버튼 -->
<div class="row"><span class="menu">☰</span></div>
<!-- 할 일: 편집 아이콘을 글자 앞에 -->
<div class="row">✎ 편집</div>
<!-- 지도: 내 위치 버튼 -->
<div class="row"><button>⌖ 내 위치</button></div>
<!-- 설정: 글자 뒤 톱니 -->
<div class="row">계정 설정 ⚙</div>
<!-- 아이콘 글꼴(사용자 영역 글자)을 쓰는데 글꼴이 없음 -->
<div class="row"><i class="ic">&#xE5CD;</i></div>
</div></body></html>
