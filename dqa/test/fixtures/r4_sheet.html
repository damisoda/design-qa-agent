<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>r4_sheet</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;color:#1B1F24;background:#fff}
#root{height:100vh;position:relative;overflow:hidden}
.map{position:absolute;inset:0;background:#EEF3EC}
.fbtns{position:absolute;right:12px;bottom:calc(36% + 12px);display:flex;flex-direction:column;gap:8px}
.fbtns button{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid #ccc;font-size:20px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:60%;background:#fff;border-radius:16px 16px 0 0;padding:16px}
footer{font-size:13px;line-height:20px;color:#A0A8B4;background:#F8FAFC;padding:12px}
</style></head><body><div id="root"><div class="map"></div>
<div class="fbtns"><button aria-label="확대">+</button><button aria-label="축소">−</button></div>
<div class="sheet"><b>숲속로스터리 망원점</b><footer>© 2026 플로우보드 · 고객센터 1588-0000</footer></div></div></body></html>
