        {
          "id": "probe_search_rank",
          "type": "custom",
          "data": {
            "type": "code",
            "title": "적용 조건 필터·순위 정리",
            "code_language": "python3",
            "code": "import json,re\ndef main(item: str, docs: list, cases: list) -> dict:\n    x=json.loads(item); out=[]; seen=set()\n    for r in (docs or [])+(cases or []):\n        c=(r.get(\"content\") or \"\").strip(); m=re.match(r\"\\[([A-Z]\\d{1,2}-\\d{3})\\]\",c)\n        if not m or m.group(0) in seen: continue\n        meta={}\n        mm=re.search(r'^DQA_META: (.+)$',c,re.M)\n        if mm:\n            try: meta=json.loads(mm.group(1))\n            except ValueError: continue\n        # Strict applicability for structured data; legacy primary sources remain candidates.\n        if meta and (meta.get('platform')!='web' or meta.get('scope') not in ('generic',x.get('project','generic'))): continue\n        if x.get('kind')=='recipe':\n            if meta.get('kind')!='recipe' or meta.get('recipe')!=x.get('recipe'):continue\n        elif meta and (meta.get('kind')=='recipe' or meta.get('rule')!=x.get('rule')):continue\n        # Legacy team tokens/cases lack applicability metadata. Keep only explicitly mapped generic primary sources.\n        if not meta:\n            allowed={'R1':['P02-003','O12-','O13-'],'F1':['P02-002','O07-'],'L2':['P02-001','O01-'],'D2':['P02-005','O06-']}.get(x.get('rule'),[])\n            if x.get('project')=='cbh':\n                if x.get('rule') in ('D2','D3','A2'):allowed=allowed+['C01-']\n                case_keys={'R1':['넘침','min-width','minWidth'],'R2':['잘림','clipping'],'R3':['겹침'],'R4':['가려','safe-area'],'I1':['무반응','반응 없음'],'I2':['오류','exception'],'I4':['목적지','prototype'],'F1':['Fill','고정 너비']}.get(x.get('rule'),[])\n                if m.group(1).startswith('C02-') and any(k.lower() in c.lower() for k in case_keys):allowed=allowed+['C02-']\n            if not any(m.group(1).startswith(prefix) for prefix in allowed):continue\n        # An exact rule card is preferred to semantically similar examples about another rule.\n        score=float((r.get('metadata') or {}).get('score') or r.get('score') or 0)\n        boost=4 if meta.get('rule')==x.get('rule') and x.get('rule') else 0\n        if x.get('kind')=='recipe':boost=4\n        seen.add(m.group(0));out.append({'id':m.group(0),'text':c,'score':round(score+boost,6),'metadata':meta,'document_id':(r.get('metadata') or {}).get('document_id')})\n    out.sort(key=lambda r:(-r['score'],r['id']))\n    selected=out[:(1 if x.get('kind')=='recipe' else 3)]\n    result={'id':x['id'],'rule':x.get('rule'),'recipe':x.get('recipe'), 'selected':selected,'candidate_count':len(out), 'query':x['query']}\n    return {'result':result}\n",
            "variables": [
              {
                "variable": "item",
                "value_selector": [
                  "probe_search_query",
                  "item"
                ]
              },
              {
                "variable": "docs",
                "value_selector": [
                  "probe_search_docs",
                  "result"
                ]
              },
              {
                "variable": "cases",
                "value_selector": [
                  "probe_search_cases",
                  "result"
                ]
              }
            ],
            "outputs": {
              "result": {
