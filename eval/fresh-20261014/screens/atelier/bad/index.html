<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier / Booking · bad</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><p class="brand" style="font-size:12px;font-weight:600;line-height:18px;color:var(--brand);">ATELIER</p><div class="heading" style="display:flex;flex-direction:column;gap:4px;padding:0px;border-radius:0px;"><h1 class="title" style="font-size:24px;font-weight:700;line-height:32px;color:var(--ink);">Reserve a visit</h1><p class="subtitle" style="font-size:14px;font-weight:400;line-height:20px;color:var(--muted);">Plan your next exhibition visit.</p></div><div class="exhibition" style="display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;background:var(--tint);"><p class="exhibition-title" style="font-size:18px;font-weight:600;line-height:24px;color:var(--ink);">Light &amp; Space</p><p class="exhibition-time" style="font-size:14px;font-weight:400;line-height:20px;color:var(--muted);">Sat, 17 Oct · 14:00</p></div><div class="fields" style="display:flex;flex-direction:column;gap:16px;padding:0px;border-radius:0px;"><div class="visitor" style="display:flex;flex-direction:column;gap:8px;padding:0px;border-radius:0px;"><p class="visitor-label" style="font-size:14px;font-weight:600;line-height:20px;color:var(--ink);">Visitor name</p><input aria-label="Visitor" class="visitor-input" style="display:flex;flex-direction:row;gap:0px;padding:12px;border-radius:8px;background:var(--paper);height:48px;border:1px solid var(--border);font-size:16px;font-weight:400;line-height:24px;color:var(--muted);" placeholder="Alex Rivera" value="Alex Rivera"></div><div class="email" style="display:flex;flex-direction:column;gap:8px;padding:0px;border-radius:0px;"><p class="email-label" style="font-size:14px;font-weight:600;line-height:20px;color:var(--ink);">Email address</p><input aria-label="Email" class="email-input" style="display:flex;flex-direction:row;gap:0px;padding:12px;border-radius:8px;background:var(--paper);height:48px;border:1px solid var(--border);font-size:16px;font-weight:400;line-height:24px;color:var(--muted);" placeholder="alex@example.com" value="alex@example.com"></div></div><button class="cta" style="display:flex;flex-direction:row;gap:0px;padding:12px;border-radius:8px;background:var(--brand);height:48px;align-items:center;justify-content:center" type="button"><p class="cta-label" style="font-size:16px;font-weight:600;line-height:24px;color:var(--paper);">Reserve visit</p></button><p class="footnote" style="font-size:12px;font-weight:400;line-height:18px;color:var(--muted);">Your reservation is free to cancel.</p></main><script>document.querySelector('.cta').addEventListener('click',()=>{});</script></body></html>
