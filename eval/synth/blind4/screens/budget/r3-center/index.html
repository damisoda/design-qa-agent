<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>가계부 · r3-center</title>
<style>:root{--bg:#FFFFFF;--page:#F0F2F5;--text:#111827;--muted:#5B6472;--line:#E5E7EB;--brand:#0E7490}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.mon{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px}
.mon button{width:40px;height:40px;border-radius:20px;background:#F3F4F6;display:flex;align-items:center;justify-content:center}.mon button svg{width:18px;height:18px}
.mon b{font-size:17px;min-width:120px;text-align:center}
.body{flex:1;overflow-y:auto;padding:0 16px 24px}
.sum{padding:16px;border-radius:16px;background:#F8FAFC;margin-bottom:12px}
.sum span{display:block;font-size:13px;line-height:18px;color:var(--muted)}.sum strong{display:block;font-size:28px;line-height:36px;margin-top:2px}
.sum p{margin:6px 0 0;font-size:13px;line-height:18px;color:#047857}
.donut{position:relative;width:200px;height:200px;margin:8px auto 12px}
.donut svg{display:block;width:200px;height:200px;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .c b{font-size:22px;line-height:28px}.donut .c span{font-size:12px;line-height:16px;color:var(--muted)}
.cat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cat i{flex:none;width:10px;height:10px;border-radius:5px}
.cat .n{flex:none;width:44px;font-size:14px;line-height:20px}
.cat .bar{flex:1;height:6px;border-radius:3px;background:#EEF0F3;position:relative}.cat .bar s{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.cat .amt{flex:none;width:84px;text-align:right;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap}
.cat .pct{flex:none;width:34px;text-align:right;font-size:12px;line-height:16px;color:var(--muted)}
.body h2{margin:20px 0 6px;font-size:16px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx .ic{flex:none;width:36px;height:36px;border-radius:18px;background:#EEF2FF;color:#3730A3;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tx .tt{flex:1;min-width:0}.tx b{display:block;font-size:14px;line-height:20px;font-weight:600}.tx span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.tx .m{flex:none;font-size:14px;line-height:20px;font-weight:600}
.donut .c b{font-size:40px;line-height:46px}</style></head><body><div id="root"><div class="app"><div class="top"><span class="ttl">가계부</span></div>
<div class="mon"><button aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><b>2026년 10월</b><button aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
<div class="body"><div class="sum"><span>이번 달 지출</span><strong>1,284,500원</strong><p>지난달보다 82,000원 적게 썼어요</p></div>
<div class="donut"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="80" fill="none" stroke="#F97316" stroke-width="24" stroke-dasharray="160.85 502.65" stroke-dashoffset="-0.00"/><circle cx="100" cy="100" r="80" fill="none" stroke="#0EA5E9" stroke-width="24" stroke-dasharray="90.48 502.65" stroke-dashoffset="-160.85"/><circle cx="100" cy="100" r="80" fill="none" stroke="#A855F7" stroke-width="24" stroke-dasharray="110.58 502.65" stroke-dashoffset="-251.32"/><circle cx="100" cy="100" r="80" fill="none" stroke="#22C55E" stroke-width="24" stroke-dasharray="100.53 502.65" stroke-dashoffset="-361.91"/><circle cx="100" cy="100" r="80" fill="none" stroke="#94A3B8" stroke-width="24" stroke-dasharray="40.21 502.65" stroke-dashoffset="-462.44"/></svg><div class="c"><b>식비 32%</b><span>가장 많이 쓴 곳</span></div></div>
<div class="cat"><i style="background:#F97316"></i><span class="n">식비</span><div class="bar"><s style="width:96%;background:#F97316"></s></div><span class="amt">411,000원</span><span class="pct">32%</span></div><div class="cat"><i style="background:#0EA5E9"></i><span class="n">교통</span><div class="bar"><s style="width:54%;background:#0EA5E9"></s></div><span class="amt">231,000원</span><span class="pct">18%</span></div><div class="cat"><i style="background:#A855F7"></i><span class="n">쇼핑</span><div class="bar"><s style="width:66%;background:#A855F7"></s></div><span class="amt">282,600원</span><span class="pct">22%</span></div><div class="cat"><i style="background:#22C55E"></i><span class="n">주거</span><div class="bar"><s style="width:60%;background:#22C55E"></s></div><span class="amt">256,900원</span><span class="pct">20%</span></div><div class="cat"><i style="background:#94A3B8"></i><span class="n">기타</span><div class="bar"><s style="width:24%;background:#94A3B8"></s></div><span class="amt">103,000원</span><span class="pct">8%</span></div>
<h2>최근 내역</h2><div class="tx"><span class="ic">스</span><div class="tt"><b>스타벅스 망원점</b><span>10월 9일 · 카드</span></div><span class="m">-6,500원</span></div><div class="tx"><span class="ic">G</span><div class="tt"><b>GS25 망원한강공원 리버뷰점 (24시 편의점)</b><span>10월 9일 · 카드</span></div><span class="m">-12,300원</span></div><div class="tx"><span class="ic">교</span><div class="tt"><b>서울교통공사</b><span>10월 8일 · 교통카드</span></div><span class="m">-1,550원</span></div><div class="tx"><span class="ic">월</span><div class="tt"><b>월세 이체</b><span>10월 5일 · 계좌</span></div><span class="m">-650,000원</span></div></div></div></div></body></html>
