<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>복약 알림 · r3-lines</title>
<style>:root{--bg:#FFFFFF;--page:#EFF1F4;--text:#141820;--muted:#5A6170;--line:#E3E6EB;--brand:#7C3AED}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.top .add{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:10px;background:#F5F3FF;color:#5B21B6;font-size:14px;font-weight:700;flex:none}.top .add svg{width:16px;height:16px}
.days{flex:none;display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.days button{width:40px;height:52px;border-radius:12px;background:transparent;font-size:12px;line-height:16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center}
.days button b{font-size:15px;line-height:20px;color:var(--text)}.days .on{background:var(--brand);color:#fff}.days .on b{color:#fff}
.body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.note{display:flex;gap:10px;padding:12px;border-radius:12px;background:#FEF3C7;color:#78350F;font-size:13px;line-height:19px;margin-bottom:12px}.note svg{flex:none;width:18px;height:18px}
.md{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.md img{flex:none;width:44px;height:44px;border-radius:12px;object-fit:cover}
.md .w{flex:1;min-width:0}.md .nm{margin:0;font-size:16px;line-height:22px;font-weight:700}.md .ds{margin:2px 0 8px;font-size:13px;line-height:18px;color:var(--muted)}
.tm{display:flex;flex-wrap:wrap;gap:6px}.tm span{font-size:12px;line-height:16px;padding:4px 10px;border-radius:12px;background:#F3F4F6;color:var(--text)}.tm .done{background:#EDE9FE;color:#5B21B6;font-weight:700}
.md [role=switch]{flex:none;width:44px;height:26px;border-radius:13px;background:var(--brand);position:relative;align-self:flex-start}
.md [role=switch]::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:10px;background:#fff}
.md [role=switch][aria-checked=false]{background:#CBD5E1}.md [role=switch][aria-checked=false]::after{right:auto;left:3px}
.md .nm{line-height:10px}</style></head><body><div id="root"><div class="app"><div class="top"><span class="ttl">복약 알림</span><button class="add"><svg viewBox="0 0 24 24" fill="none" stroke="#5B21B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>약 추가</button></div>
<div class="days"><button>월<b>13</b></button><button>화<b>14</b></button><button class=on>수<b>15</b></button><button>목<b>16</b></button><button>금<b>17</b></button><button>토<b>18</b></button><button>일<b>19</b></button></div>
<div class="body"><div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg><span>식후 30분 안에 먹는 약은 알림이 식사 기록 뒤에 울려요. 약을 거르면 다음 알림에서 알려 드려요.</span></div>
<div class="md"><img src="pill1.png" alt="오메가3 1000mg 사진"><div class="w"><p class="nm">오메가3 1000mg</p><p class="ds">1캡슐 · 아침 식후</p><div class="tm"><span class=done>08:00 복용</span><span>20:00</span></div></div><button role="switch" aria-checked="true" aria-label="오메가3 1000mg 알림"></button></div><div class="md"><img src="pill2.png" alt="비타민D 2000IU 사진"><div class="w"><p class="nm">비타민D 2000IU (주 1회, 일요일 아침)</p><p class="ds">1정 · 아침 식후</p><div class="tm"><span>08:00</span></div></div><button role="switch" aria-checked="true" aria-label="비타민D 2000IU 알림"></button></div><div class="md"><img src="pill3.png" alt="유산균 사진"><div class="w"><p class="nm">유산균</p><p class="ds">1포 · 공복</p><div class="tm"><span class=done>07:30 복용</span></div></div><button role="switch" aria-checked="false" aria-label="유산균 알림"></button></div><div class="md"><img src="pill4.png" alt="혈압약 암로디핀 5mg 사진"><div class="w"><p class="nm">혈압약 암로디핀 5mg (저녁 식후 30분)</p><p class="ds">1정 · 저녁 식후</p><div class="tm"><span>19:00</span></div></div><button role="switch" aria-checked="true" aria-label="혈압약 암로디핀 5mg 알림"></button></div></div></div></div></body></html>
