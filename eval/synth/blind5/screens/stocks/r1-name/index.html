<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>내 투자 · r1-name</title>
<style>:root{--bg:#FFFFFF;--page:#EEF0F3;--text:#0F172A;--muted:#5B6474;--line:#E2E8F0;--brand:#DC2626}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.tot span{display:block;font-size:13px;line-height:18px;color:var(--muted)}.tot strong{display:block;font-size:30px;line-height:38px}
.tot .chg{display:block;font-size:14px;line-height:20px;font-weight:600;color:#DC2626}
.chart{position:relative;margin-top:12px;height:180px}
.chart svg{display:block;width:100%;height:180px}
.chart .yl{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;line-height:14px;color:var(--muted)}
.chart .tip{position:absolute;right:12px;top:6px;font-size:12px;line-height:16px;padding:4px 8px;border-radius:8px;background:#111827;color:#fff}
.per{display:flex;gap:6px;margin:10px 0 14px}.per button{flex:1;height:34px;border-radius:10px;background:#F1F5F9;font-size:13px;color:var(--muted)}.per .on{background:var(--text);color:#fff}
.body h2{margin:6px 0 4px;font-size:16px}
.hd{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hd img{flex:none;width:36px;height:36px;border-radius:18px}
.hd .w{flex:1;min-width:0}.hd .w b{display:block;font-size:15px;line-height:20px}.hd .w span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.hd .v{flex:none;text-align:right}.hd .v b{display:block;font-size:15px;line-height:20px}
.hd .v .up{display:block;color:#DC2626;font-size:12px;line-height:16px;white-space:nowrap}.hd .v .dn{display:block;color:#2563EB;font-size:12px;line-height:16px;white-space:nowrap}
.hd .w{flex:none}.hd .w b{white-space:nowrap}</style></head><body><div id="root"><div class="app"><div class="top"><span class="ttl">내 투자</span></div>
<div class="body"><div class="tot"><span>총 평가금액</span><strong>6,451,500원</strong><span class="chg">+312,400원 (+5.09%) 오늘</span></div>
<div class="chart"><svg viewBox="0 0 343 180" preserveAspectRatio="none" aria-hidden="true"><polygon points="56,150 100,120 140,128 180,96 220,104 260,70 300,58 343,40 343,180 56,180" fill="#FEE2E2"/><polyline points="56,150 100,120 140,128 180,96 220,104 260,70 300,58 343,40" fill="none" stroke="#DC2626" stroke-width="2.5"/></svg><div class="yl"><span>6.6백만</span><span>6.3백만</span><span>6.0백만</span></div><span class="tip">10월 10일 6,451,500원</span></div>
<div class="per"><button>1일</button><button class="on">1주</button><button>1달</button><button>1년</button></div>
<h2>보유 종목</h2><div class="hd"><img src="logo_sam.png" alt="삼성전자 로고"><div class="w"><b>삼성전자</b><span>42주 · 평균 68,200원</span></div><div class="v"><b>3,024,000원</b><span class="up">+4.12%</span></div></div><div class="hd"><img src="logo_skh.png" alt="SK하이닉스 로고"><div class="w"><b>SK하이닉스</b><span>8주 · 평균 172,000원</span></div><div class="v"><b>1,512,000원</b><span class="up">+12.48%</span></div></div><div class="hd"><img src="logo_kai.png" alt="한국항공우주산업(KAI) 보통주 로고"><div class="w"><b>한국항공우주산업(KAI) 보통주</b><span>15주 · 평균 54,300원</span></div><div class="v"><b>742,500원</b><span class="dn">-8.84%</span></div></div><div class="hd"><img src="logo_nav.png" alt="NAVER 로고"><div class="w"><b>NAVER</b><span>6주 · 평균 201,500원</span></div><div class="v"><b>1,173,000원</b><span class="dn">-2.97%</span></div></div></div></div></div></body></html>
