<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>동네생활 · r4-reply</title>
<style>:root{--bg:#FFFFFF;--page:#EDEFF2;--text:#131619;--muted:#5D646E;--line:#E4E7EB;--brand:#2563EB}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.body{flex:1;overflow-y:auto;padding:0 0 84px}
.post{padding:16px}
.au{display:flex;align-items:center;gap:10px}.au img{width:40px;height:40px;border-radius:20px;flex:none}
.au .w{flex:1;min-width:0}.au b{display:block;font-size:15px;line-height:20px}.au span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.au button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--text)}
.post h1{margin:14px 0 6px;font-size:19px;line-height:27px}
.post .tx{margin:0;font-size:15px;line-height:24px}.post .tx a{color:#1D4ED8}
.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}.pics img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
.acts{display:flex;align-items:center;gap:4px;margin-top:10px}.acts button{display:flex;align-items:center;gap:4px;height:40px;padding:0 10px;border-radius:20px;background:transparent;font-size:13px;color:var(--muted)}.acts button svg{width:18px;height:18px;flex:none}
.cmts{border-top:8px solid #F3F4F6;padding:8px 16px}
.cm{display:flex;gap:10px;padding:10px 0}.cm img{width:32px;height:32px;border-radius:16px;flex:none}
.cm .w{flex:1;min-width:0}.cm .h{display:flex;align-items:center;gap:6px}.cm .h b{font-size:13px;line-height:18px}
.cm .h em{font-style:normal;font-size:11px;line-height:14px;padding:1px 6px;border-radius:6px;background:#DBEAFE;color:#1E40AF}.cm .h span{font-size:12px;line-height:16px;color:var(--muted)}
.cm p{margin:2px 0 0;font-size:14px;line-height:21px}
.cm.re{padding-left:42px}
.reply{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.reply input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);padding:0 16px;font-size:14px;font-family:inherit}
.reply button{flex:none;height:44px;padding:0 16px;border-radius:22px;background:var(--brand);color:#fff;font-size:14px;font-weight:700}
.body{padding-bottom:0}</style></head><body><div id="root"><div class="app"><div class="top"><button class="icon" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="ttl">동네생활</span></div>
<div class="body"><div class="post"><div class="au"><img src="a1.png" alt="작성자 사진"><div class="w"><b>망원동산책러</b><span>3시간 전 · 망원동</span></div><button>팔로우</button></div>
<h1>망원한강공원 노을 명당 정리해 봤어요</h1>
<p class="tx">주말마다 다니면서 찾은 노을 잘 보이는 자리 세 곳이에요. 자세한 위치는 <a href="#">지도 링크</a>에 모아 뒀어요. 해 지기 30분 전에 가면 자리 잡기 좋아요. 돗자리는 꼭 챙기세요.</p>
<div class="pics"><img src="p1.png" alt="노을 사진 1"><img src="p2.png" alt="노을 사진 2"></div>
<div class="acts"><button><svg viewBox="0 0 24 24" fill="none" stroke="#5D646E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>좋아요 128</button><button><svg viewBox="0 0 24 24" fill="none" stroke="#5D646E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>댓글 12</button><button aria-label="공유"><svg viewBox="0 0 24 24" fill="none" stroke="#5D646E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5h14v-5"/></svg></button></div></div>
<div class="cmts"><div class="cm"><img src="a2.png" alt="한강러버 사진"><div class="w"><div class="h"><b>한강러버</b><span>2시간 전</span></div><p>두 번째 자리 진짜 좋아요! 지난주에 다녀왔어요.</p></div></div><div class="cm re"><img src="a1.png" alt="망원동산책러 사진"><div class="w"><div class="h"><b>망원동산책러</b><em>작성자</em><span>1시간 전</span></div><p>감사해요. 다음엔 일출 명당도 올릴게요.</p></div></div><div class="cm"><img src="a3.png" alt="자전거타는곰 사진"><div class="w"><div class="h"><b>자전거타는곰</b><span>30분 전</span></div><p>주차는 어디에 하셨나요?</p></div></div><div class="cm"><img src="a4.png" alt="노을수집가 사진"><div class="w"><div class="h"><b>노을수집가</b><span>10분 전</span></div><p>사진 색감이 너무 좋네요. 어떤 카메라 쓰세요?</p></div></div></div></div>
<div class="reply"><input placeholder="댓글을 남겨 주세요"><button>등록</button></div></div></div></body></html>
