<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>세탁 맡기기 · ok</title>
<style>:root{--bg:#FFFFFF;--page:#ECF0F3;--text:#10161B;--muted:#58636E;--line:#E1E7EC;--brand:#0284C7}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.body{flex:1;overflow-y:auto;padding:16px 16px 112px}
.addr{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:#F0F9FF;font-size:14px;line-height:20px}
.addr svg{width:18px;height:18px;flex:none}.addr span{flex:1;min-width:0}
.body h2{margin:18px 0 8px;font-size:16px;line-height:22px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.it img{width:40px;height:40px;flex:none}
.it .w{flex:1;min-width:0}.it b{display:block;font-size:15px;line-height:21px}.it span{font-size:12px;line-height:16px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}.qty button svg{width:16px;height:16px}
.qty em{width:24px;text-align:center;font-style:normal;font-size:15px;font-weight:700}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slots button{height:56px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;line-height:18px;color:var(--text)}
.slots .on{border-color:var(--brand);background:#F0F9FF;color:#075985;font-weight:700}
.req{width:100%;min-height:72px;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;line-height:20px;resize:none}
.sum{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;background:#fff;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
.sum .r{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--muted)}.sum .r b{color:var(--text);font-size:17px}
.sum button{display:block;width:100%;height:50px;border-radius:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:700}
</style></head><body><div id="root"><div class="app"><div class="top"><button class="icon" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="ttl">세탁 맡기기</span></div>
<div class="body"><div class="addr"><svg viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span>서울 마포구 월드컵로 12길 34, 망원 한강뷰 오피스텔 202호 (경비실 옆 무인 보관함)</span></div>
<h2>맡길 옷</h2>
<div class="it"><img src="s1.png" alt=""><div class="w"><b>셔츠·블라우스</b><span>드라이 · 다림질 포함</span></div><div class="qty"><button aria-label="셔츠·블라우스 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><em>3</em><button aria-label="셔츠·블라우스 더하기"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div class="it"><img src="s2.png" alt=""><div class="w"><b>니트·스웨터</b><span>울 전용 세탁</span></div><div class="qty"><button aria-label="니트·스웨터 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><em>1</em><button aria-label="니트·스웨터 더하기"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div class="it"><img src="s3.png" alt=""><div class="w"><b>이불(퀸 이상)</b><span>대형 세탁 · 2일 소요</span></div><div class="qty"><button aria-label="이불(퀸 이상) 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><em>1</em><button aria-label="이불(퀸 이상) 더하기"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
<h2>수거 시간</h2><div class="slots"><button>오늘<br>19~21시</button><button class="on">오늘<br>21~23시</button><button>내일<br>07~09시</button></div>
<h2>요청 사항</h2><textarea class="req" aria-label="요청 사항">셔츠 소매 얼룩 부탁드려요.</textarea></div>
<div class="sum"><div class="r"><span>예상 금액(5점)</span><b>27,500원</b></div><button>수거 신청하기</button></div></div></div></body></html>
