<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>재생 목록 · m2-cover</title>
<style>:root{--bg:#FFFFFF;--page:#EEF0F3;--text:#111111;--muted:#6B7280;--line:#E5E7EB;--brand:#E11D48;--dark:#18181B}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:44px}
.scroll{flex:1;overflow-y:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:20px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.15);z-index:5}
.sheet[hidden]{display:none}
.hd{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.hd h1{margin:0;font-size:17px;line-height:24px;font-weight:700}.hb{width:40px;height:40px;padding:8px;display:flex}
.intro{padding:8px 20px 0}.intro h2{margin:0;font-size:22px;line-height:30px;font-weight:700}.intro p{margin:4px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
.acts{display:flex;gap:8px;padding:16px 20px 8px}
.acts button{height:40px;padding:0 18px;border-radius:20px;font-size:14px;line-height:20px;font-weight:700}
.acts .all{background:var(--brand);color:#fff}.acts .shuf{border:1px solid var(--line);height:40px}
.list{padding-top:8px}.song{display:flex;align-items:center;gap:12px;padding:8px 20px}
.song img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.song .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.song b{font-size:15px;line-height:22px;font-weight:600}.song span{font-size:13px;line-height:18px;color:var(--muted)}
.song .mb{width:24px;height:24px;flex:none;display:flex}
.mini{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--dark)}
.mini img{width:40px;height:40px;border-radius:6px;flex:none}.mini .t{flex:1;min-width:0;display:flex;flex-direction:column}
.mini b{font-size:14px;line-height:20px;font-weight:600;color:#fff}.mini span{font-size:12px;line-height:16px;color:#A1A1AA}.mini .pb{width:28px;height:28px;display:flex;flex:none}
</style></head><body><div id="root"><div class="app"><header class="hd"><a class="hb" href="list.html" aria-label="뒤로"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1>재생 목록</h1><button class="hb" data-sheet="메뉴" aria-label="더보기"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></header><div class="scroll"><div class="intro"><h2>새벽 감성 모음</h2><p>곡 4개 · 16분</p></div><div class="acts"><button class="all" data-sheet="모두 재생">모두 재생</button><button class="shuf" data-sheet="셔플 재생">셔플</button></div><div class="list"><div class="song"><img src="c1.png" alt="밤의 산책 표지"><div class="t"><b>밤의 산책</b><span>윤하늘</span></div><button class="mb" data-sheet="밤의 산책 메뉴" aria-label="밤의 산책 메뉴"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div><div class="song"><div class="t"><b>여름 끝자락</b><span>모래와 바람</span></div><button class="mb" data-sheet="여름 끝자락 메뉴" aria-label="여름 끝자락 메뉴"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div><div class="song"><img src="c3.png" alt="새벽 세 시 표지"><div class="t"><b>새벽 세 시</b><span>김도윤 트리오</span></div><button class="mb" data-sheet="새벽 세 시 메뉴" aria-label="새벽 세 시 메뉴"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div><div class="song"><img src="c4.png" alt="우리가 걷던 길 표지"><div class="t"><b>우리가 걷던 길</b><span>하루</span></div><button class="mb" data-sheet="우리가 걷던 길 메뉴" aria-label="우리가 걷던 길 메뉴"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div></div></div><div class="mini"><img src="c1.png" alt="지금 재생 표지"><div class="t"><b>밤의 산책</b><span>윤하늘</span></div><button class="pb" data-toggle aria-label="재생"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg></button></div><div class="sheet" id="sheet" hidden><p style="margin:0 0 12px;font-size:16px;font-weight:700"></p><button data-close style="width:100%;height:44px;border-radius:12px;background:#111;color:#fff">닫기</button></div></div></div><script>
document.querySelectorAll('[data-sheet]').forEach((b) => b.addEventListener('click', () => { const s = document.getElementById('sheet'); s.querySelector('p').textContent = b.getAttribute('data-sheet'); s.hidden = false }))
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => { document.getElementById('sheet').hidden = true }))
document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => { b.classList.toggle('on'); b.setAttribute('aria-checked', b.classList.contains('on')) }))
</script></body></html>
