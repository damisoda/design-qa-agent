<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>예약 · ok</title>
<style>:root{--bg:#FFFFFF;--page:#EEF0F4;--text:#141A23;--muted:#566070;--line:#E1E5EB;--brand:#5B3CC4}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 0}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.mon b{font-size:18px}.mon button{width:44px;height:44px;border-radius:10px;background:#F2F3F6;font-size:18px}
.cal{width:100%}.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk span{font-size:12px;color:var(--muted);padding:4px 0}
.days button{height:40px;border-radius:10px;background:#fff;font-size:15px;color:var(--text);min-width:0}.days button.on{background:var(--brand);color:#fff;font-weight:700}
.days button.past{color:#6B7280}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.slot{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:14px;white-space:nowrap}
.slot.on{border-color:var(--brand);color:var(--brand);font-weight:700}
.req{display:block;font-size:14px;font-weight:600;margin-bottom:12px}.req textarea{display:block;width:100%;height:88px;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-weight:400}
.sum{margin:0 0 12px;font-size:14px;color:var(--muted)}.sum b{color:var(--text)}
.ok{flex:none;margin:8px 16px 16px;height:54px;border-radius:14px;background:var(--brand);color:#fff;font-size:17px;font-weight:700}
</style></head><body><div id="root"><div class="app"><div class="top"><span class="ttl">예약</span></div><div class="body">
<div class="mon"><button aria-label="이전 달">‹</button><b>2026년 10월</b><button aria-label="다음 달">›</button></div>
<div class="cal"><div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days"><span></span><span></span><span></span><span></span><button class="past">1</button><button class="past">2</button><button class="past">3</button><button class="past">4</button><button class="past">5</button><button class="past">6</button><button class="past">7</button><button class="past">8</button><button class="past">9</button><button class="">10</button><button class="">11</button><button class="">12</button><button class="">13</button><button class="">14</button><button class="">15</button><button class="">16</button><button class=" on">17</button><button class="">18</button><button class="">19</button><button class="">20</button><button class="">21</button><button class="">22</button><button class="">23</button><button class="">24</button><button class="">25</button><button class="">26</button><button class="">27</button><button class="">28</button><button class="">29</button><button class="">30</button><button class="">31</button></div></div>
<div class="slots"><button class="slot">10:00</button><button class="slot on">10:30</button><button class="slot">11:00</button><button class="slot">11:30</button><button class="slot">13:30</button><button class="slot">14:00</button><button class="slot">15:00</button><button class="slot">16:30</button><button class="slot">17:00</button><button class="slot">18:30</button></div>
<label class="req">요청 사항<textarea placeholder="예: 앞머리만 다듬어 주세요"></textarea></label>
<p class="sum"><span class="sl">선택한 시간</span> <b>10월 17일(토) 10:30 · 디자이너 지수</b></p></div>
<button class="ok">예약 확정</button></div></div></body></html>
