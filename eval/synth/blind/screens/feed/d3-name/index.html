<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>피드 · d3-name</title>
<style>:root{--bg:#FFFFFF;--page:#EDEEF0;--text:#111318;--muted:#5C6270;--line:#E4E6EA;--brand:#D7263D}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.list{flex:1;overflow-y:auto;padding-bottom:88px}
.post{border-bottom:8px solid #F3F4F6}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px}.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.who{flex:1;min-width:0}.who b{display:block;font-size:15px;font-weight:700;line-height:20px}.who span{display:block;font-size:12px;color:var(--muted)}
.follow{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.pic{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.acts{display:flex;align-items:center;gap:16px;padding:10px 16px;font-size:14px;position:relative}.acts span{white-space:nowrap}.acts .share{margin-left:auto;padding:8px 6px}
.cap{margin:0;padding:0 16px 14px;font-size:14px;line-height:21px;overflow-wrap:anywhere}.cap em{font-style:normal;color:#1D4ED8}
.fab{position:absolute;right:16px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.who b{font-weight:400}</style></head><body><div id="root"><div class="app"><div class="top"><span class="ttl">피드</span></div><div class="list">
<div class="post"><div class="ph"><img class="av" src="av1.png" alt="산책하는곰"><div class="who"><b>산책하는곰</b><span>1시간 전</span></div><button class="follow">팔로우</button></div>
<img class="pic" src="pic1.png" alt="산책하는곰의 사진"><div class="acts"><span class="like">좋아요 1,284</span><span class="cmt">댓글 56</span><span class="share">공유</span></div><p class="cap">한강 노을 <em>#주말나들이추천코스서울근교당일치기여행지노을맛집총정리</em> <em>#노을</em></p></div>
<div class="post"><div class="ph"><img class="av" src="av2.png" alt="오늘의빵"><div class="who"><b>오늘의빵</b><span>3시간 전</span></div><button class="follow">팔로우</button></div>
<img class="pic" src="pic2.png" alt="오늘의빵의 사진"><div class="acts"><span class="like">좋아요 1,284</span><span class="cmt">댓글 56</span><span class="share">공유</span></div><p class="cap">새로 나온 무화과 깜파뉴 <em>#빵스타그램</em></p></div>
<div class="post"><div class="ph"><img class="av" src="av3.png" alt="하늘공방"><div class="who"><b>하늘공방</b><span>어제</span></div><button class="follow">팔로우</button></div>
<img class="pic" src="pic3.png" alt="하늘공방의 사진"><div class="acts"><span class="like">좋아요 1,284</span><span class="cmt">댓글 56</span><span class="share">공유</span></div><p class="cap">성수동 공방 투어 <em>#공방</em></p></div></div>
<button class="fab" aria-label="글쓰기">+</button></div></div></body></html>
