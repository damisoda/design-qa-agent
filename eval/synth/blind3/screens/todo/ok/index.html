<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>오늘 할 일 · ok</title>
<style>:root{--bg:#FFFFFF;--page:#EEF0F3;--text:#15181C;--muted:#5A616B;--line:#E2E5E9;--brand:#4F46E5}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.top .flt{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--text);flex:none}.top .flt svg{width:16px;height:16px;flex:none}
.prog{flex:none;margin:12px 16px 8px;padding:14px 16px;border-radius:14px;background:#EEF2FF}
.prog p{margin:0 0 8px;font-size:14px;line-height:20px;color:#3730A3}.prog p b{font-size:16px}
.pbar{height:6px;border-radius:3px;background:#C7D2FE;position:relative}.pbar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:3px;background:var(--brand)}
.filters{flex:none;display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto}
.filters button{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--text);white-space:nowrap}.filters .on{background:var(--text);color:#fff;border-color:var(--text)}
.list{flex:1;overflow-y:auto;padding:0 16px 96px}
.list h2{margin:12px 0 6px;font-size:14px;line-height:20px;color:var(--muted)}
.it{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.it input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--brand)}
.it .t{flex:1;min-width:0;font-size:15px;line-height:21px}
.it .due{flex:none;font-size:12px;line-height:16px;color:var(--muted)}
.it.done .t{text-decoration:line-through;color:var(--muted)}
.pri{flex:none;font-size:11px;line-height:16px;font-weight:700;padding:2px 6px;border-radius:6px;background:#FEE2E2;color:#991B1B}
.fab{position:absolute;right:16px;bottom:20px;width:56px;height:56px;border-radius:28px;background:var(--brand);color:#fff;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
</style></head><body><div id="root"><div class="app"><div class="top"><span class="ttl">오늘 할 일</span><button class="flt"><svg viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>필터</button></div>
<div class="prog"><p><b>5개</b> 중 2개 완료</p><div class="pbar"><i></i></div></div>
<div class="filters"><button class="on">전체</button><button>업무</button><button>개인</button><button>장보기</button><button>운동</button><button>공부</button><button>가족</button><button>취미</button></div>
<div class="list"><h2>오전</h2><label class="it done"><input type="checkbox" aria-label="완료 표시" checked><span class="t">아침 스트레칭 10분</span><span class="due">오전 7시</span></label><label class="it"><input type="checkbox" aria-label="완료 표시"><span class="t">분기 보고서 초안을 팀장님께 보내고 피드백 반영 일정 잡기</span><span class=pri>높음</span><span class="due">오전 11시</span></label>
<h2>오후</h2><label class="it"><input type="checkbox" aria-label="완료 표시"><span class="t">장보기: 우유, 달걀, 방울토마토</span><span class="due">오후 6시</span></label><label class="it"><input type="checkbox" aria-label="완료 표시"><span class="t">헬스장 PT 예약 확인</span><span class="due">오후 7시</span></label><label class="it done"><input type="checkbox" aria-label="완료 표시" checked><span class="t">치과 예약 변경 전화</span><span class="due">오후 2시</span></label></div>
<button class="fab" aria-label="할 일 추가">+</button></div></div></body></html>
