<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>날씨 · ok</title>
<style>:root{--bg:#0F3D6E;--page:#0A2540;--text:#FFFFFF;--muted:#C3D0DF;--line:rgba(255,255,255,.18);--brand:#FBBF24}*{box-sizing:border-box}html,body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--page)}
button{font-family:inherit;border:0;cursor:pointer}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;flex:none}
.icon svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto}

.top{border-bottom:0}
.loc{flex:1;display:flex;align-items:center;gap:4px;height:44px;background:transparent;color:var(--text);font-size:17px;font-weight:700;padding:0}.loc svg{width:16px;height:16px;flex:none}
.top .rf{width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}.top .rf svg{width:20px;height:20px}
.body{flex:1;overflow-y:auto;padding:0 16px 24px}
.now{text-align:center;padding:12px 0 20px}
.now .tmp{display:block;font-size:88px;line-height:96px;font-weight:300;letter-spacing:-2px}
.now .cond{display:block;font-size:15px;line-height:22px;color:var(--muted)}
.card{background:rgba(255,255,255,.1);border-radius:16px;padding:12px;margin-bottom:12px}
.hourly{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory}
.hr{flex:none;width:56px;scroll-snap-align:start;text-align:center;padding:6px 0}
.hr span{display:block;font-size:12px;line-height:16px;color:var(--muted)}.hr svg{width:24px;height:24px;margin:6px auto;display:block}.hr b{display:block;font-size:15px;line-height:20px}
.wk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.wk:first-child{border-top:0}
.wk .d{flex:none;width:40px;font-size:15px;line-height:20px}
.wk svg{flex:none;width:22px;height:22px}
.wk .lo{flex:none;width:34px;text-align:right;font-size:15px;line-height:20px;color:var(--muted)}
.wk .rg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2);position:relative}.wk .rg i{position:absolute;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#60A5FA,#FBBF24)}
.wk .hi{flex:none;width:34px;font-size:15px;line-height:20px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dc{background:rgba(255,255,255,.1);border-radius:16px;padding:12px}
.dc span{display:block;font-size:12px;line-height:16px;color:var(--muted)}.dc b{display:block;margin-top:4px;font-size:20px;line-height:26px}.dc p{margin:2px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
</style></head><body><div id="root"><div class="app"><div class="top"><button class="loc">서울 마포구<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><button class="rf" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button></div>
<div class="body"><div class="now"><span class="tmp">18°</span><span class="cond">구름 많음 · 최고 21° 최저 12°</span></div>
<div class="card"><div class="hourly"><div class="hr"><span>지금</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><b>18°</b></div><div class="hr"><span>오후 3시</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><b>19°</b></div><div class="hr"><span>4시</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><b>20°</b></div><div class="hr"><span>5시</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><b>19°</b></div><div class="hr"><span>6시</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><b>17°</b></div><div class="hr"><span>7시</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><b>16°</b></div><div class="hr"><span>8시</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><b>15°</b></div><div class="hr"><span>9시</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><b>14°</b></div></div></div>
<div class="card"><div class="wk"><span class="d">오늘</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><span class="lo">12°</span><div class="rg"><i style="left:12%;right:24%"></i></div><span class="hi">21°</span></div><div class="wk"><span class="d">내일</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lo">13°</span><div class="rg"><i style="left:18%;right:18%"></i></div><span class="hi">22°</span></div><div class="wk"><span class="d">수</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><span class="lo">11°</span><div class="rg"><i style="left:6%;right:36%"></i></div><span class="hi">19°</span></div><div class="wk"><span class="d">목</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lo">14°</span><div class="rg"><i style="left:24%;right:12%"></i></div><span class="hi">23°</span></div><div class="wk"><span class="d">금</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lo">15°</span><div class="rg"><i style="left:30%;right:6%"></i></div><span class="hi">24°</span></div><div class="wk"><span class="d">토</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><span class="lo">13°</span><div class="rg"><i style="left:18%;right:30%"></i></div><span class="hi">20°</span></div><div class="wk"><span class="d">일</span><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg><span class="lo">12°</span><div class="rg"><i style="left:12%;right:24%"></i></div><span class="hi">21°</span></div></div>
<div class="grid"><div class="dc"><span>미세먼지</span><b>좋음</b><p>18㎍/㎥</p></div><div class="dc"><span>자외선</span><b>보통</b><p>지수 4</p></div><div class="dc"><span>습도</span><b>62%</b><p>이슬점 10°</p></div><div class="dc"><span>바람</span><b>3m/s</b><p>북서풍</p></div></div></div></div></div></body></html>
