<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #16181d; }
  main { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font-size: 14px; }
  p { margin: 0; color: #5b626d; }
  ul { margin: 0; padding: 8px 10px; list-style: none; border: 1px solid #e3e6ea; border-radius: 8px; min-height: 40px; max-height: 140px; overflow: auto; }
  li { padding: 2px 0; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
  input { height: 30px; border: 1px solid #d0d4da; border-radius: 6px; padding: 0 8px; font: inherit; font-weight: 400; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; height: 34px; border: 1px solid #d0d4da; border-radius: 8px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: #16181d; color: #fff; border-color: #16181d; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 40px; white-space: pre-wrap; }
  .err { color: #b42318; }
  .ok { color: #166534; }
</style>
</head>
<body>
<main>
  <h1>dqa 시안 내보내기</h1>
  <p>이 파일의 프레임을 선택하세요. dqa 웹 화면에서 파일명과 프레임을 확인하고 가져올 수 있습니다.</p>
  <p id="file-name"></p><p id="connection" role="status">dqa 연결 확인 중</p><ul id="sel"><li>프레임을 선택하세요</li></ul>
  <label>dqa 주소<input id="host" value="http://localhost:8792"></label>
  <label>시안 묶음 이름(선택)<input id="group" placeholder="예: 신고 화면 v3"></label>
  <div class="row">
    <button class="primary" id="send" disabled>dqa로 보내기</button>
    <button id="save" disabled>파일로 받기</button>
  </div>
  <div id="msg"></div>
</main>
<script>
const $ = (id) => document.getElementById(id)
const say = (t, cls) => { $('msg').textContent = t; $('msg').className = cls || '' }
let count = 0; let selection = { frames: [], file: '', page: '' }
const clientId = typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : `dqa-${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`; const seen = new Set(); let ack = null; let polling = false
async function poll () {
  if (polling) return; polling = true
  try {
    const r = await fetch($('host').value.replace(/\/$/, '') + '/api/figma/plugin', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-DQA': '1' }, body: JSON.stringify({ client_id: clientId, ...selection, ack }) })
    const j = await r.json(); if (!r.ok || !j.ok) throw new Error(j.error || '연결 실패')
    ack = null
    $('connection').textContent = j.session_id ? 'dqa 웹 화면과 연결됨 · 웹에서 프레임을 가져오세요' : 'dqa 연결됨 · 웹 화면의 Figma 앱 열기로 이어가세요'
    const c = j.command
    if (c && !seen.has(c.id)) {
      seen.add(c.id)
      if (c.type === 'export') { say('웹에서 요청한 프레임을 가져오고 있습니다'); parent.postMessage({ pluginMessage: { type: 'export', target: 'dqa', frame_ids: c.frame_ids, request_id: c.id, session_id: c.session_id } }, '*') }
      if (c.type === 'focus') parent.postMessage({ pluginMessage: { type: 'focus', node_id: c.node_id, request_id: c.id } }, '*')
    }
  } catch (e) { $('connection').textContent = 'dqa 웹 화면에 연결하지 못했습니다. 서버가 켜져 있는지 확인하세요.' }
  finally { polling = false }
}
setInterval(poll, 1000)

onmessage = async (e) => {
  const m = e.data.pluginMessage
  if (!m) return
  if (m.type === 'selection') {
    selection = { frames: m.frames, file: m.file || '', page: m.page || '' }; $('file-name').textContent = `${selection.file} / ${selection.page}`
    count = m.frames.length
    poll()
    $('sel').innerHTML = count ? m.frames.map((f) => `<li>${f.name.replace(/</g, '&lt;')} · ${f.w}×${f.h}</li>`).join('') : '<li>프레임을 선택하세요</li>'
    $('send').disabled = $('save').disabled = !count
  }
  if (m.type === 'focused') { ack = { id: m.request_id, ok: true, node_id: m.node_id, name: m.name, file: m.file }; say(`${m.name}을 Figma에서 선택했습니다`, 'ok'); poll() }
  if (m.type === 'focus-error') { ack = { id: m.request_id, ok: false, error: m.message }; say(m.message, 'err'); poll() }
  if (m.type === 'error') { if (m.request_id) { ack = { id: m.request_id, ok: false, error: m.message }; poll() } say(m.message, 'err') }
  if (m.type === 'exported') {
    if (m.target === 'file') {
      for (const it of m.items) {
        download(`${it.name}.design.json`, new Blob([JSON.stringify(it.spec, null, 1)], { type: 'application/json' }))
        download(`${it.name}.design.png`, new Blob([Uint8Array.from(atob(it.png), (c) => c.charCodeAt(0))], { type: 'image/png' }))
      }
      say(`${m.items.length}개 프레임을 파일로 받았습니다. design.json과 design.png를 같은 폴더에 두고 dqa check --design 폴더로 씁니다.`, 'ok')
      return
    }
    try {
      const host = $('host').value.replace(/\/$/, '')
      const r = await fetch(`${host}/api/designs`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-DQA': '1' }, body: JSON.stringify({ group: $('group').value, items: m.items, ...(m.session_id ? { session_id: m.session_id, request_id: m.request_id, client_id: clientId } : {}) }) })
      const j = await r.json()
      if (!r.ok || !j.ok) throw new Error(j.error || `HTTP ${r.status}`)
      if (m.request_id) { ack = { id: m.request_id, ok: true }; poll() }
      say(`dqa에 ${j.saved.length}개 넣었습니다:\n${j.saved.map((s) => `· ${s.name} (${s.base})`).join('\n')}`, 'ok')
      parent.postMessage({ pluginMessage: { type: 'notify', message: `dqa에 시안 ${j.saved.length}개를 넣었습니다` } }, '*')
    } catch (err) { if (m.request_id) { ack = { id: m.request_id, ok: false, error: err.message }; poll() } say(`보내지 못했습니다: ${err.message}\ndqa serve가 켜져 있는지 확인하거나 "파일로 받기"를 쓰세요.`, 'err') }
  }
}
parent.postMessage({ pluginMessage: { type: 'selection' } }, '*')
poll()
function download (name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click() }
$('send').onclick = () => { say('내보내는 중…'); parent.postMessage({ pluginMessage: { type: 'export', target: 'dqa' } }, '*') }
$('save').onclick = () => { say('내보내는 중…'); parent.postMessage({ pluginMessage: { type: 'export', target: 'file' } }, '*') }
</script>
</body>
</html>
